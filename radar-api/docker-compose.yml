name: radar

services:
  radar-api:
    image: ${IMAGE_TAG:-radar-api:latest}
    container_name: radar-api
    expose:
      - "${INTERNAL_PORT:-8088}"
    ports:
      - "${RADAR_PORT:-8088}:${INTERNAL_PORT:-8088}"
    environment:
      PORT: "${INTERNAL_PORT:-8088}"
      JWT_SECRET: ${JWT_SECRET:-change-me-radar-jwt}
      DATABASE_PATH: /data/radar.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://radar.xaigrok.ir}
      LOGO_DIR: /data/logos
      GIN_MODE: release
    volumes:
      - radar-sqlite-vol:/data
    networks:
      - t3-net
    restart: "no"

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true

volumes:
  radar-sqlite-vol:
    name: radar-sqlite-vol
